<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Review Form</title>
<meta name="description" content="Product Review Form">
<meta name="author" content="Juliana Alves Ribeiro">

<link rel="stylesheet" href="styles/form.css">
<link rel="stylesheet" href="styles/form-desktop.css">

<script src="scripts/form.js" defer></script>
</head>

<body>

<div class="container">
  <h1>Product Review</h1>

  <form method="get" action="review.html">

    <!-- Product -->
    <label for="product">Product Name</label>
    <select id="product" name="product" required>
      <option value="" disabled selected>Select a Product ...</option>
    </select>

    <!-- Rating -->
    <label>Overall Rating</label>
    <div class="rating">
      <label><input type="radio" name="rating" value="1" required> ☆</label>
      <label><input type="radio" name="rating" value="2"> ☆☆</label>
      <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
      <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
      <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
    </div>

    <!-- Date -->
    <label for="date">Date of Installation</label>
    <input type="date" id="date" name="date" required>

    <!-- Features -->
    <label>Which features did you find useful? (Check all that apply)</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="features" value="durability"> Durability</label>
      <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
      <label><input type="checkbox" name="features" value="performance"> Performance</label>
      <label><input type="checkbox" name="features" value="design"> Design</label>
    </div>

    <!-- Review -->
    <label for="review">Written Review (Optional)</label>
    <textarea id="review" name="review"></textarea>

    <!-- Name -->
    <label for="username">Your Name (Optional)</label>
    <input type="text" id="username" name="username">

    <input type="submit" value="Post Review" class="submit-btn">

  </form>
</div>

<footer>
  <p>©2026 🌸 Juliana Ribeiro 🌸</p>
  <p id="lastModified"></p>
</footer>

</body>
</html>
