<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Review Form</title>
<meta name="description" content="Product Review Form - WDD 131 - Dynamic Web Fundamentals">
<meta name="author" content="Juliana Alves Ribeiro">

<link rel="stylesheet" href="styles/form.css">

<script src="scripts/form.js" defer></script>
<script src="scripts/form-review.js" defer></script>
</head>

<body>

<header>
  <h1>Product Review</h1>
</header>

<main class="container">

<form method="get" action="review.html">

<!-- Product -->
<label for="product">Product Name</label>
<select id="product" name="product" required>
  <option value="" disabled selected>Select a Product ...</option>
</select>

<!-- Rating -->
<p>Overall Rating</p>
<div class="rating">

  <input type="radio" id="r1" name="rating" value="1" required>
  <label for="r1">☆</label>

  <input type="radio" id="r2" name="rating" value="2" required>
  <label for="r2">☆☆</label>

  <input type="radio" id="r3" name="rating" value="3" required>
  <label for="r3">☆☆☆</label>

  <input type="radio" id="r4" name="rating" value="4" required>
  <label for="r4">☆☆☆☆</label>

  <input type="radio" id="r5" name="rating" value="5" required>
  <label for="r5">☆☆☆☆☆</label>

</div>

<!-- Date -->
<label for="date">Date of Installation</label>
<input type="date" id="date" name="date" required>

<!-- Features -->
<p>Which features did you find useful? (Check all that apply)</p>

<div class="checkbox-group">

  <label>
    <input type="checkbox" id="durability" name="features" value="durability">
    Durability
  </label>

  <label>
    <input type="checkbox" id="ease" name="features" value="ease">
    Ease of Use
  </label>

  <label>
    <input type="checkbox" id="performance" name="features" value="performance">
    Performance
  </label>

  <label>
    <input type="checkbox" id="design" name="features" value="design">
    Design
  </label>

</div>

<!-- Review -->
<label for="review">Written Review (Optional)</label>
<textarea id="review" name="review"></textarea>

<!-- Name -->
<label for="username">Your Name (Optional)</label>
<input type="text" id="username" name="username">

<input type="submit" value="Post Review" class="submit-btn">

</form>

</main>

<footer>
  <p>©2026 🌸 Juliana Ribeiro 🌸</p>
  <p id="lastModified"></p>
</footer>

</body>
</html>
